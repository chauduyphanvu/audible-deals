site_name: audible-deals
site_description: Find, compare, and track Audible audiobook deals from the command line.
site_url: https://chauduyphanvu.github.io/audible-deals/
repo_url: https://github.com/chauduyphanvu/audible-deals
repo_name: chauduyphanvu/audible-deals
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: installation.md
  - Command guide: commands.md
  - Price tracking and automation: automation.md
  - Advanced recipes: recipes.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

strict: true
