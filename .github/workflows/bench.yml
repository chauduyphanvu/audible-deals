name: Bench variants (temporary)

on:
  push:
    branches: [ci/faster-cheaper]

permissions:
  contents: read

jobs:
  # The new release build-binaries steps, minus upload, with a fake version.
  release-dry-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: deals-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            artifact: deals-macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            artifact: deals-windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: 9.9.9-bench
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Update version in pyproject.toml
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          rm pyproject.toml.bak
          git diff --stat

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false

      - run: uv pip install --system -e . pyinstaller

      - name: Build binary (onedir via spec)
        shell: bash
        env:
          DEALS_ARTIFACT: ${{ matrix.artifact }}
        run: pyinstaller deals.spec --noconfirm

      - name: Package archive
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          else
            7z a "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi
          ls -l

      - name: Check binary version
        shell: bash
        run: |
          out="$(./dist/${{ matrix.artifact }}/deals --version)"
          echo "$out"
          [ "$out" = "deals, version ${VERSION}" ]
