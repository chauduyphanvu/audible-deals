name: Bench variants (temporary)

on:
  push:
    branches: [ci/faster-cheaper]

permissions:
  contents: read

jobs:
  # Timing only: test_install_script.py assumes an x86_64 host, so it is left
  # out on both architectures to compare like with like.
  arch:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        shards: ["3", "4"]
        python-version: ["3.11", "3.13"]
        rep: [1, 2]
        exclude:
          - { runner: ubuntu-latest, shards: "4" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: |
          lscpu | grep -E 'Model name|Thread|Core\(s\)'
          rm tests/test_install_script.py
          /usr/bin/time -f "BENCH wall=%e user=%U sys=%S" uv run --no-sync python -c "import sys; sys.path.insert(0, '.github/scripts'); import run_tests; run_tests.shard_count = lambda: ${{ matrix.shards }}; sys.argv = ['run_tests', '-v']; sys.exit(run_tests.main())"
