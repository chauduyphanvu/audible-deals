name: Bench variants (temporary)

on:
  push:
    branches: [ci/faster-cheaper]

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shards: [serial, "2", "3", "4"]
        prep: [none, bytecode, preimport]
        rep: [1, 2]
        exclude:
          - { shards: serial, prep: bytecode }
          - { shards: serial, prep: preimport }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --python 3.13
      - name: Run tests (${{ matrix.shards }}, ${{ matrix.prep }})
        run: |
          lscpu | grep -E 'Model name'
          cat > /tmp/run.sh <<'SH'
          set -e
          case "$PREP" in
            bytecode) uv sync -q --locked --extra dev --python 3.13 --compile-bytecode --reinstall ;;
            preimport) uv run --no-sync python -c "import compileall, pytest; compileall.compile_dir('src', quiet=1)" ;;
          esac
          if [ "$SHARDS" = serial ]; then
            uv run --no-sync pytest tests/ -v -p no:cacheprovider
          else
            uv run --no-sync python -c "import sys; sys.path.insert(0, '.github/scripts'); import run_tests; run_tests.cpu_count = lambda: $SHARDS; sys.argv = ['run_tests', '-v']; sys.exit(run_tests.main())"
          fi
          SH
          /usr/bin/time -f "BENCH wall=%e user=%U sys=%S" bash /tmp/run.sh
        env:
          SHARDS: ${{ matrix.shards }}
          PREP: ${{ matrix.prep }}

  uv-cache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [true, false]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: ${{ matrix.cache }}
      - run: /usr/bin/time -f "BENCH wall=%e user=%U sys=%S" uv sync --locked --extra dev --python 3.13

  setup-uv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [latest, "0.13.4"]
        rep: [1, 2]
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false
          version: ${{ matrix.version == 'latest' && '' || matrix.version }}
