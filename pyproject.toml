[project]
name = "audible-deals"
dynamic = ["version"]
description = "CLI to find and sort Audible audiobook deals by price and genre"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["audible", "audiobook", "deals", "cli", "price-tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "audible>=0.8.0",
    "click>=8.2",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/chauduyphanvu/audible-deals"
Repository = "https://github.com/chauduyphanvu/audible-deals"
Issues = "https://github.com/chauduyphanvu/audible-deals/issues"
Changelog = "https://github.com/chauduyphanvu/audible-deals/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15,<0.16", "pre-commit>=4.0", "mypy>=2.4,<3", "keyring>=25", "textual>=8.2,<9"]
docs = ["mkdocs-material>=9.7,<10"]
keyring = ["keyring>=25"]
tui = ["textual>=8.2,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/audible_deals/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audible_deals"]

[project.scripts]
deals = "audible_deals.cli:cli"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/audible_deals"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["audible", "audible.*"]
ignore_missing_imports = true
